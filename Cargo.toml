[package]
name = "typewritter"
version = "0.1.0"
edition = "2024"

# Vendored plotters (crates/plotters) is a `git subtree` of
# plotters-rs/plotters, edited in place. Its upstream root Cargo.toml is
# removed so it doesn't form a nested workspace; pull upstream with
# `git subtree pull --prefix=crates/plotters plotters-upstream master --squash`.
[workspace]
members = [".", "crates/plotters/plotters", "crates/plotters/plotters-backend"]

[dependencies]
# Vendored Atomos platform (src/renderer, src/input.rs, src/frame.rs,
# src/animation.rs) — see docs/atomos/. Versions track Atomos; wgpu is
# pinned to glyphon's, upgrade the two together.

# The OS clipboard. Pure Rust on every platform we target — x11rb and
# wl-clipboard-rs on Linux, no GTK — which matters because this app draws
# all of its own chrome and links no other UI toolkit.
arboard = "3.6"
bytemuck = { version = "1.18", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
glyphon = "0.11.0"
fuzzy-matcher = "0.3.7"
image = { version = "0.25", default-features = false, features = ["png"] }
lyon = "1.0.19"
lyon_extra = "1.1"
plotters = { path = "crates/plotters/plotters", default-features = false, features = ["line_series"] }
pollster = "0.4"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
serde = { version = "1.0.229", features = ["derive"] }
swash = "0.2.9"
toml = "1.1.4"
wgpu = "29.0.4"
winit = "0.30.13"
krilla = { version = "0.8.2", default-features = false }
tree-sitter-highlight = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-rust = "0.24.2"
tree-sitter-lua = "0.5.0"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
serde_json = "1.0.151"

# Dependencies are optimized even in dev builds. Nothing in this app's own
# hot path is the problem — the shell's per-frame `update` costs single-digit
# microseconds — but a frame's cost is almost entirely *inside* the
# dependencies: wgpu encoding and submitting one render pass per layer, swash
# rasterizing glyphs, lyon tessellating paths. Unoptimized, those are 6-17x
# slower, which is the difference between a frame that fits in a 120 Hz
# budget and one that misses 60 Hz.
#
# Measured on an M-series Mac, debug, scale factor 2, 13 layers, idle:
#
#              deps -O0   deps -O3
#   render      7-19ms     1.12ms
#   encode     210-295µs     27µs
#   submit     2.2-3.1ms   1.06ms
#
# `opt-level = 3` for dependencies only — this crate stays at `0`, so its own
# debuginfo, overflow checks, and step-through debugging are unaffected. The
# cost is a one-time ~2 minute rebuild of the dependency graph; incremental
# rebuilds of this crate are unchanged.
[profile.dev.package."*"]
opt-level = 3
